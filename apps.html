<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قسم التطبيقات | ELYASSINO APK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f5f6fa;font-family:Arial,Tahoma,sans-serif}
header{padding:25px 16px;text-align:center;background:#171c28;border-bottom:1px solid #30394a;position:relative}
.menu-btn{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:28px;color:#65b8ff;cursor:pointer}
h1{margin:0;color:#65b8ff;font-size:28px}header p{color:#aeb8c9;margin:8px 0 0;font-size:14px}
main{max-width:760px;margin:24px auto;padding:0 14px}.search{width:100%;padding:13px;border-radius:10px;border:1px solid #374256;background:#1a2130;color:white;font-size:16px;margin-bottom:16px}
.empty-msg{text-align:center;color:#9da9bb;margin-top:40px;font-size:18px}

/* القائمة الجانبية */
.sidebar{height:100%;width:0;position:fixed;z-index:1;top:0;right:0;background:#171c28;overflow-x:hidden;transition:0.5s;padding-top:60px;border-left:1px solid #30394a}
.sidebar .close-btn{position:absolute;top:15px;left:25px;font-size:36px;color:#aaa;cursor:pointer}
.user-space{height:120px;border-bottom:1px solid #30394a;margin-bottom:20px}
.sidebar a{padding:15px 25px;text-decoration:none;font-size:20px;color:#f5f6fa;display:block;transition:0.3s}
.sidebar a:hover{color:#65b8ff}
</style>
</head>
<body>

<header>
<button class="menu-btn" onclick="toggleNav()">☰</button>
<h1>قسم التطبيقات</h1><p>ابحث عن تطبيقاتك المفضلة</p>
</header>

<div id="mySidebar" class="sidebar">
  <span class="close-btn" onclick="toggleNav()">&times;</span>
  <div class="user-space"></div>
  <a href="#">الأقسام</a>
  <a href="index.html">• قسم الألعاب</a>
  <a href="apps.html">• قسم التطبيقات</a>
</div>

<main>
<input id="searchApps" class="search" type="search" placeholder="ابحث عن تطبيق..." aria-label="ابحث عن تطبيق">
<div class="empty-msg">
<p>سيتم إضافة التطبيقات هنا في المستقبل.</p>
</div>
</main>
<script>
function toggleNav() {
  const sidebar = document.getElementById("mySidebar");
  if (sidebar.style.width === "250px") {
    sidebar.style.width = "0";
  } else {
    sidebar.style.width = "250px";
  }
}
</script>
</body>
</html>
